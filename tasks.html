<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="tasks.css" />
    <title>Kimi 导出任务</title>
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <div class="topbar__text">
          <div class="topbar__head">
            <h1 data-i18n="tasks.title">Kimi 导出任务</h1>
            <span class="version" id="app-version"></span>
          </div>
          <p class="topbar__hint" id="hint" data-i18n="tasks.hint">
            导出期间保持此页打开，中断后可按已保存的进度继续。
          </p>
        </div>
        <div class="topbar__tools">
          <!-- Same control as the popup's: the two labels are their own language
               names, so they are never translated. -->
          <div
            class="seg seg--lang"
            id="seg-locale"
            role="radiogroup"
            data-i18n-attr="aria-label:popup.lang.label"
          >
            <button type="button" data-locale="zh-CN" role="radio" aria-checked="false">中文</button>
            <button type="button" data-locale="en-US" role="radio" aria-checked="true">EN</button>
          </div>
          <a
            class="iconlink"
            href="https://github.com/micooz/kimi-chat-exporter"
            target="_blank"
            rel="noreferrer"
            aria-label="GitHub"
            title="GitHub"
          >
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <path
                fill="currentColor"
                d="M12 .3a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2c-3.3.7-4-1.6-4-1.6-.6-1.4-1.4-1.8-1.4-1.8-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.5 1 0-.8.4-1.3.7-1.6-2.7-.3-5.5-1.3-5.5-5.9 0-1.3.5-2.4 1.2-3.2-.1-.3-.5-1.5.1-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0c2.3-1.5 3.3-1.2 3.3-1.2.6 1.7.2 2.9.1 3.2.8.8 1.2 1.9 1.2 3.2 0 4.6-2.8 5.6-5.5 5.9.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 .3"
              />
            </svg>
          </a>
        </div>
      </header>

      <p class="alert" id="error" role="alert" hidden></p>

      <div class="layout" id="layout">
        <aside class="rail" id="rail">
          <div class="rail__head">
            <h2 class="label" data-i18n="tasks.rail.title">任务列表</h2>
            <button class="minibtn" id="btn-clear-jobs" type="button" data-i18n="common.clear">
              清空
            </button>
          </div>
          <nav class="jobs" id="jobs" aria-label="导出任务" data-i18n-attr="aria-label:tasks.rail.nav"></nav>
        </aside>
        <div class="column">
          <div class="column__head">
            <h2 class="label" data-i18n="tasks.detail.title">任务详情</h2>
          </div>
          <section class="detail" id="detail"></section>
        </div>
      </div>

      <section class="empty" id="empty" hidden>
        <h2 class="empty__title" data-i18n="tasks.empty.title">还没有导出任务</h2>
        <p class="empty__text" data-i18n="tasks.empty.text">
          在任意 Kimi 对话页点击扩展图标，选好要导出的对话后，这里会显示进度、失败清单和可下载的 ZIP。
        </p>
        <button class="btn btn--primary" id="empty-open" type="button" data-i18n="tasks.empty.open">
          打开扩展弹窗
        </button>
      </section>
    </div>
    <script type="module" src="tasks.js"></script>
  </body>
</html>
