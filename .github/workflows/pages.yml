name: Deploy Pages

# Publishes the privacy policy that the Chrome Web Store listing links to.
# The extension itself is not a site: only PRIVACY.md is rendered and deployed.

on:
  push:
    branches: [main]
    paths:
      - PRIVACY.md
      - .github/pages/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # PRIVACY.md stays the single source of truth; the site source only adds
      # the layout around it.
      - name: Copy the privacy policy into the site source
        run: cp PRIVACY.md .github/pages/privacy.md

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build the site with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./.github/pages
          destination: ./_site

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
